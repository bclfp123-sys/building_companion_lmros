services:
  # 1. MLflow Service for Experiment Tracking & Model Registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.1
    container_name: mlflow_server_legal
    ports:
      - "5001:5000"
    volumes:
      - ../db:/mlflow/db            # Database location for metadata
      - ../artifacts:/artifacts     # Location for model artifacts
      - ./init-mlflow.sh:/init-mlflow.sh
    restart: always
    user: "0:0"  # Run as root to manage permissions
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow/db/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/artifacts
    command: ["bash", "/init-mlflow.sh"]

  # 2. JupyterLab Service for Interactive Development
  jupyter:
    image: jupyter/scipy-notebook:latest # Using a data science-ready image
    container_name: jupyter_lab_legal
    ports:
      - "8889:8888" # Using port 8889 to avoid conflicts
    volumes:
      - ../:/home/jovyan/work # Mount the entire project folder
      - ../artifacts:/artifacts # Specific access to artifacts
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - MLFLOW_TRACKING_URI=http://mlflow:5000 # Connect to our MLflow service
      # We will add OpenAI/Azure credentials here later
      # - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      # - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
    restart: always
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.allow_root=True
    depends_on:
      - mlflow

